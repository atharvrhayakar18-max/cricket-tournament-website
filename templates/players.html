<!DOCTYPE html>
<html>
<head>
    <title>Cricket Tournament - Players</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .navbar {
            background-color: #1e3a8a;
            padding: 18px;
            text-align: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #1e3a8a;
            color: white;
        }

        tr:hover {
            background-color: #f1f5ff;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <a href="/">🏠 Home</a>
        <a href="/teams">🏏 Teams</a>
        <a href="/players">👤 Players</a>
        <a href="/matches">🏟️ Matches</a>
        <a href="/points">🏆 Points Table</a>
    </div>

    <div class="container">

        <h2>👤 Player Statistics</h2>

        <table>

            <tr>
                <th>Player ID</th>
                <th>Player Name</th>
                <th>Team ID</th>
                <th>Runs</th>
                <th>Wickets</th>
            </tr>

            {% for player in players %}

            <tr>
                <td>{{ player[0] }}</td>
                <td>{{ player[1] }}</td>
                <td>{{ player[2] }}</td>
                <td>{{ player[4] }}</td>
                <td>{{ player[3] }}</td>
            </tr>

            {% endfor %}

        </table>

    </div>

</body>
</html>
