<!DOCTYPE html>
<html>
<head>
    <title>Cricket Tournament</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .navbar {
            background-color: #1e3a8a;
            padding: 18px;
            text-align: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
            font-weight: bold;
        }

        .admin-link {
            background-color: #dc2626;
            padding: 8px 14px;
            border-radius: 6px;
        }

        .hero {
            text-align: center;
            padding: 80px 20px;
        }

        .hero h1 {
            font-size: 45px;
            color: #1e3a8a;
        }

        .hero p {
            font-size: 20px;
            color: #555;
        }

        .button {
            display: inline-block;
            background-color: #1e3a8a;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            margin-top: 20px;
        }

        .admin-button {
            display: inline-block;
            background-color: #dc2626;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            margin-top: 20px;
            margin-left: 10px;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <a href="/">🏠 Home</a>
        <a href="/teams">🏏 Teams</a>
        <a href="/players">👤 Players</a>
        <a href="/matches">🏟️ Matches</a>
        <a href="/points">🏆 Points Table</a>
        <a href="/login" class="admin-link">🔐 Admin Login</a>
    </div>

    <div class="hero">

        <h1>🏏 Cricket Tournament</h1>

        <p>
            Welcome to our Cricket Tournament Management Website!
        </p>

        <a href="/teams" class="button">
            View Teams
        </a>

        <a href="/matches" class="button">
            View Matches
        </a>

        <a href="/points" class="button">
            View Points Table
        </a>

        <br>

        <a href="/login" class="admin-button">
            🔐 Admin Login
        </a>

    </div>

</body>
</html>
